info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{basse_url}}/auth/login"
  body:
    type: json
    data: |+
      {
        "username":"mio",
        "password":"password"
      }

  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
